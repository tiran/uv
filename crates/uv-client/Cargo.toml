[package]
name = "uv-client"
version = "0.0.88"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[features]
default = ["aws-lc"]
test-pypi = []
# rustls crypto provider backend; select exactly one. Both use the same rustls reqwest backend, so
# certificate and mTLS handling is identical.
#
# `aws-lc` (default): bundled aws-lc-rs via reqwest, matching upstream uv.
# `ossl`: system OpenSSL 3.x via `rustls-native-ossl`, installed as the process-wide provider at
# startup and dropping aws-lc entirely, so downstream rebuilds inherit the system crypto policy
# (e.g. FIPS). Always uses the system trust store.
aws-lc = ["reqwest/rustls", "rustls/aws_lc_rs", "rustls/prefer-post-quantum", "dep:webpki-root-certs"]
ossl = ["dep:rustls-native-ossl", "dep:rustls-pemfile", "reqwest/rustls-no-provider"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
uv-auth = { workspace = true }
uv-cache = { workspace = true }
uv-cache-key = { workspace = true }
